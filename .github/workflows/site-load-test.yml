name: One-off Site Load Test

on:
  push:
    paths:
      - '.github/workflows/site-load-test.yml'

permissions:
  contents: read

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run bounded HTTP load test
        shell: bash
        run: |
          python - <<'PY' > load-test-report.txt
          import concurrent.futures, json, statistics, time, urllib.request, urllib.error
          from collections import Counter

          def one(url, method="GET", body=None, headers=None):
              req=urllib.request.Request(url, data=body, method=method, headers=headers or {})
              start=time.perf_counter()
              try:
                  with urllib.request.urlopen(req, timeout=12) as r:
                      data=r.read(512)
                      return {"ok": True, "code": r.status, "sec": time.perf_counter()-start, "url": r.geturl(), "sample": data[:80].decode("utf-8","ignore")}
              except urllib.error.HTTPError as e:
                  return {"ok": True, "code": e.code, "sec": time.perf_counter()-start, "url": url, "sample": e.read(256).decode("utf-8","ignore")}
              except Exception as e:
                  return {"ok": False, "code": None, "sec": time.perf_counter()-start, "url": url, "error": type(e).__name__+": "+str(e)}

          def batch(name, url, total, concurrency, method="GET", body=None, headers=None, expected=None):
              started=time.perf_counter()
              with concurrent.futures.ThreadPoolExecutor(max_workers=concurrency) as ex:
                  rows=list(ex.map(lambda _: one(url, method, body, headers), range(total)))
              elapsed=time.perf_counter()-started
              lat=sorted(r["sec"] for r in rows)
              def pct(p):
                  if not lat: return None
                  idx=min(len(lat)-1, max(0, int(round((len(lat)-1)*p))))
                  return lat[idx]
              codes=Counter(str(r["code"]) if r["code"] is not None else "ERR" for r in rows)
              expected_set=set(expected or [])
              bad=sum(1 for r in rows if not r["ok"] or (expected_set and r["code"] not in expected_set))
              print("\n==", name, "==")
              print("URL:", url)
              print("Requests:", total, "Concurrency:", concurrency, "Elapsed_s:", round(elapsed,3), "Req_per_s:", round(total/elapsed,2))
              print("Status_counts:", dict(codes), "Unexpected:", bad)
              print("Latency_s p50/p95/max:", round(pct(.50),3), round(pct(.95),3), round(max(lat),3))
              sample=next((r for r in rows if r.get("url")), None)
              if sample: print("Final_url_sample:", sample.get("url"))
              errs=[r.get("error") for r in rows if r.get("error")]
              if errs: print("Errors_sample:", errs[:5])
              return bad

          total_bad=0
          total_bad += batch(
              "GitHub Pages static site",
              "https://kenlow-coder.github.io/sudu-sprout/?loadtest=1",
              60, 10, expected=[200]
          )
          total_bad += batch(
              "Custom domain static site",
              "https://suduandsprout.com/?loadtest=1",
              60, 10, expected=[200]
          )
          total_bad += batch(
              "Supabase CORS preflight",
              "https://cahoocydfiujuelkrqqf.supabase.co/functions/v1/create-subscription-order",
              40, 10, method="OPTIONS",
              headers={
                  "Origin":"https://suduandsprout.com",
                  "Access-Control-Request-Method":"POST",
                  "Access-Control-Request-Headers":"content-type"
              },
              expected=[200]
          )
          total_bad += batch(
              "Supabase invalid POST validation (no order creation)",
              "https://cahoocydfiujuelkrqqf.supabase.co/functions/v1/create-subscription-order",
              20, 5, method="POST", body=b"{}",
              headers={"Origin":"https://suduandsprout.com","Content-Type":"application/json"},
              expected=[400]
          )
          print("\nTOTAL_UNEXPECTED:", total_bad)
          PY
          cat load-test-report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: load-test-report.txt
          retention-days: 1
