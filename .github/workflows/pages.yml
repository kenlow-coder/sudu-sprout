name: Deploy Sudu & Sprout to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone Sudu & Sprout site
        env:
          SUDU_SPROUT_FAVICON: ""
        run: |
          mkdir -p public
          curl -L --fail --retry 3 "https://kenlow-coder.github.io/macro-sudu-site/sudu-sprout/" -o public/index.html
          test -s public/index.html
          printf '%s' "$SUDU_SPROUT_FAVICON" | base64 --decode > public/favicon.png
          test -s public/favicon.png
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("public/index.html")
          s=p.read_text(encoding="utf-8")
          s=re.sub(r'<link\s+rel=["\'](?:shortcut )?icon["\'][^>]*>\s*','',s,flags=re.I)
          s=re.sub(r'<link\s+rel=["\']apple-touch-icon["\'][^>]*>\s*','',s,flags=re.I)
          links='''<link rel="icon" type="image/png" sizes="256x256" href="./favicon.png?v=4">
<link rel="shortcut icon" type="image/png" href="./favicon.png?v=4">
<link rel="apple-touch-icon" sizes="180x180" href="./favicon.png?v=4">
<meta name="theme-color" content="#fff8ed">'''
          s=s.replace("</head>",links+"\n</head>",1)
          p.write_text(s,encoding="utf-8")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "public"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
