name: Deploy Sudu & Sprout to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone Sudu & Sprout site
        env:
          SUDU_SPROUT_FAVICON: ""
        run: |
          mkdir -p public
          curl -L --fail --retry 3 "https://kenlow-coder.github.io/macro-sudu-site/sudu-sprout/" -o public/index.html
          test -s public/index.html
          python - <<'PY'
          from pathlib import Path
          import os, re
          p=Path("public/index.html")
          s=p.read_text(encoding="utf-8")
          tag='<link rel="icon" type="image/png" href="data:image/png;base64,'+os.environ["SUDU_SPROUT_FAVICON"]+'">'
          if re.search(r'<link\s+rel=["\']icon["\'][^>]*>',s,re.I):
              s=re.sub(r'<link\s+rel=["\']icon["\'][^>]*>',tag,s,count=1,flags=re.I)
          else:
              s=s.replace("</head>",tag+"\n</head>",1)
          p.write_text(s,encoding="utf-8")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "public"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
