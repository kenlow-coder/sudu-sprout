name: Deploy Sudu & Sprout to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone Sudu & Sprout site
        run: |
          mkdir -p public
          curl -L --fail --retry 3 "https://kenlow-coder.github.io/macro-sudu-site/sudu-sprout/" -o public/index.html
          cp favicon.png public/favicon.png
          cp favicon.ico public/favicon.ico
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("public/index.html")
          s=p.read_text(encoding="utf-8")
          s=re.sub(r'<link\s+rel=["\'](?:shortcut )?icon["\'][^>]*>\s*','',s,flags=re.I)
          s=re.sub(r'<link\s+rel=["\']apple-touch-icon["\'][^>]*>\s*','',s,flags=re.I)
          links='<link rel="icon" href="./favicon.ico?v=7" sizes="any">\n<link rel="icon" type="image/png" sizes="64x64" href="./favicon.png?v=7">\n<link rel="shortcut icon" href="./favicon.ico?v=7">\n<link rel="apple-touch-icon" href="./favicon.png?v=7">'
          s=s.replace("</head>",links+"\n</head>",1)
          p.write_text(s,encoding="utf-8")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "public"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
