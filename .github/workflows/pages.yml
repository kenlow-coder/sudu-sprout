name: Deploy Sudu & Sprout to GitHub Pages
# Refresh source after stronger address dedupe

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone site from the latest source artifact
        run: |
          mkdir -p public
          RUN_ID=$(curl -fsSL "https://api.github.com/repos/kenlow-coder/macro-sudu-site/actions/runs?branch=main&per_page=1" | python -c 'import json,sys; print(json.load(sys.stdin)["workflow_runs"][0]["id"])')
          ARTIFACT_ID=$(curl -fsSL "https://api.github.com/repos/kenlow-coder/macro-sudu-site/actions/runs/${RUN_ID}/artifacts" | python -c 'import json,sys; print(next(a["id"] for a in json.load(sys.stdin)["artifacts"] if a["name"]=="github-pages" and not a["expired"]))')
          curl -L --fail --retry 3 "https://api.github.com/repos/kenlow-coder/macro-sudu-site/actions/artifacts/${ARTIFACT_ID}/zip" -o /tmp/source-pages.zip
          mkdir -p /tmp/source-pages
          unzip -p /tmp/source-pages.zip artifact.tar | tar -xf - -C /tmp/source-pages
          cp /tmp/source-pages/sudu-sprout/index.html public/index.html
          base64 -d favicon.b64 > public/favicon.png
          base64 -d favicon.ico.b64 > public/favicon.ico
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("public/index.html")
          s=p.read_text(encoding="utf-8")
          s=re.sub(r'<link\s+rel=["\'](?:shortcut )?icon["\'][^>]*>\s*','',s,flags=re.I)
          s=re.sub(r'<link\s+rel=["\']apple-touch-icon["\'][^>]*>\s*','',s,flags=re.I)
          links='<link rel="icon" type="image/png" sizes="64x64" href="./favicon.png?v=9">\n<link rel="shortcut icon" type="image/x-icon" href="./favicon.ico?v=9">\n<link rel="apple-touch-icon" href="./favicon.png?v=9">'
          s=s.replace("</head>",links+"\n</head>",1)
          p.write_text(s,encoding="utf-8")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "public"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
