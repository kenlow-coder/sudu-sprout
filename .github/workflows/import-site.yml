name: Import Sudu & Sprout site

on:
  push:
    paths:
      - ".github/workflows/import-site.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy current Sudu & Sprout site
        run: |
          curl -L --fail --retry 3 "https://kenlow-coder.github.io/macro-sudu-site/sudu-sprout/" -o index.html
          test -s index.html
      - name: Commit site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Site already current"
          else
            git commit -m "Import Sudu & Sprout website"
            git push
          fi
