name: One-off Visual Check

on:
  push:
    paths:
      - '.github/workflows/site-visual-check.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Capture desktop and mobile screenshots
        shell: bash
        run: |
          set -e
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "Using $CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=3000 --window-size=1440,9000 --screenshot=desktop.png "https://suduandsprout.com/?visualcheck=1"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=3000 --window-size=390,9000 --screenshot=mobile.png "https://suduandsprout.com/?visualcheck=1"
          file desktop.png mobile.png
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: site-screenshots
          path: |
            desktop.png
            mobile.png
          retention-days: 1
